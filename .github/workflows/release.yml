name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0), or "beta" for the Beta Update'
        required: true
        default: 'v1.0.0'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh run list -R "${{ github.repository }}" -w Build -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          SHA=$(gh run view "$RUN" -R "${{ github.repository }}" --json headSha -q .headSha)
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          mkdir -p out
          gh run download "$RUN" -R "${{ github.repository }}" -n JalyClient-Setup -D out
          gh run download "$RUN" -R "${{ github.repository }}" -n JalyClient-mod -D out
          ls -la out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.tag }}" = "beta" ]; then
            gh release delete beta --cleanup-tag -y --repo "${{ github.repository }}" 2>/dev/null || true
            sleep 3
            gh release create beta out/JalyClient-Setup.exe out/*.jar \
              --prerelease --target "$SHA" \
              --title "JalyClient Beta Update" \
              --notes "**Beta Update** - new features that aren't finished yet, so expect bugs. Built from ${SHA:0:7}.

          Turn it on in the launcher: **Settings > Beta testing**. JalyClient then updates itself to the newest beta.

          In this beta:
          - Beta testing switch in the launcher settings
          - JalyClient on many more Minecraft versions: 1.21, 1.21.1, 1.21.4, 1.21.5, 1.21.7-1.21.11. Make a profile with a ⭐ version and the launcher puts the right JalyClient in it
          - Tools > Visuals > Realistic Blending: neighbouring blocks fade into each other (sand into red sand, grass into dirt...), with strength, width, range and block settings
          - Tools > Visuals > Connected Textures: glass joins into one clean window with a frame around the outside (switches itself off if you use Continuity)
          - Everything from 1.7.0 (Visuals, PvP tools, custom music discs, friends, profiles, credits)" \
              --repo "${{ github.repository }}"
          else
            gh release create "${{ inputs.tag }}" out/JalyClient-Setup.exe out/*.jar \
              --title "JalyClient ${{ inputs.tag }}" \
              --notes "The jolliest free Minecraft client. Download **JalyClient-Setup.exe**, run it, open JalyClient and press PLAY. Runs on Minecraft 1.21, 1.21.1, 1.21.4, 1.21.5 and 1.21.7-1.21.11 (Fabric): make a profile with a ⭐ version. The .jar files are the mod on its own, one per Minecraft version." \
              --repo "${{ github.repository }}"
          fi
