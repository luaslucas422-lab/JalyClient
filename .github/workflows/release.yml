name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Get the latest successful build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN=$(gh run list -R "${{ github.repository }}" -w Build -b main -s success -L 1 --json databaseId -q '.[0].databaseId')
          mkdir -p out
          gh run download "$RUN" -R "${{ github.repository }}" -n JalyClient-Setup -D out
          gh run download "$RUN" -R "${{ github.repository }}" -n JalyClient-mod -D out
          ls -la out
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" out/JalyClient-Setup.exe out/*.jar \
            --title "JalyClient ${{ inputs.tag }}" \
            --notes "The jolliest free Minecraft client. Download **JalyClient-Setup.exe**, run it, open JalyClient and press PLAY. Minecraft 1.21.1 (Fabric). The .jar is the mod on its own." \
            --repo "${{ github.repository }}"
