name: Test in game
on:
  push:
    branches: [main]
    paths: ['mod/**', 'launcher/catalog.json', 'tools/fetch_modpack.py', '.github/workflows/smoke.yml']
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null
      - name: Make a test world
        working-directory: mod
        run: |
          mkdir -p run && cd run
          echo eula=true > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-monsters=false\n' > server.properties
          cd ..
          (gradle runServer --args nogui > server.out 2>&1 &)
          for i in $(seq 1 100); do sleep 3; grep -q 'Done (' run/logs/latest.log 2>/dev/null && break; done
          tail -3 run/logs/latest.log || tail -30 server.out
          sleep 5
          pkill -f KnotServer || pkill -f runServer || true
          sleep 5
          gradle --stop || true
          mkdir -p run/saves && cp -r run/world run/saves/smoke
          rm -f run/saves/smoke/session.lock
      - name: Launch the game
        working-directory: mod
        env: { JALY_SMOKE: '1' }
        run: |
          printf 'onboardAccessibility:false\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nguiScale:2\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 gradle runClient > client.out 2>&1 || echo "EXIT $?"
          echo "=====CLIENTLOG"
          grep -nE "JALY|JalyClient|jalyclient|ERROR|Exception|Caused by|at fr\.darkerdawn|Mixin|crash" run/logs/latest.log | cut -c1-400 | head -150 || true
          echo "=====TAIL"
          tail -15 client.out
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "=====CRASH"; head -150 "$f"; }; done
          i=0
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            i=$((i+1))
            convert "$f" -resize 960x -quality 70 shot.jpg
            echo "=====SHOT $i"
            base64 -w 120 shot.jpg
            echo "=====ENDSHOT"
          done
          echo "=====END"
          grep -q "JALY-SMOKE\] done, failures=0" client.out run/logs/latest.log

  modpack:
    name: real game + full launcher modpack
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null && pip install -q portablemc
      - name: Build JalyClient and make a test world
        working-directory: mod
        run: |
          gradle build -x test
          mkdir -p run && cd run
          echo eula=true > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-monsters=false\n' > server.properties
          cd ..
          (gradle runServer --args nogui > server.out 2>&1 &)
          for i in $(seq 1 100); do sleep 3; grep -q 'Done (' run/logs/latest.log 2>/dev/null && break; done
          sleep 5; pkill -f KnotServer || true; sleep 5; gradle --stop || true
      - name: Install like a player (JalyClient + every default launcher mod)
        run: |
          mkdir -p work/mods work/saves
          cp -r mod/run/world work/saves/smoke && rm -f work/saves/smoke/session.lock
          cp $(ls mod/build/libs/*.jar | grep -v sources) work/mods/
          python3 tools/fetch_modpack.py work/mods --with-fabric-api
          printf 'onboardAccessibility:false\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nguiScale:2\n' > work/options.txt
          ls work/mods | wc -l
      - name: Launch the real game
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 1200 portablemc --main-dir "$PWD/mc" start --mc-dir "$PWD/work" -u JalyTester --jvm-arg=-Xmx3G --jvm-arg=-Djaly.smoke=true --join-world smoke fabric:1.21.1:0.20.1 > client.out 2>&1 || echo "EXIT $?"
          tail -5 client.out
          echo "=====CLIENTLOG"
          grep -nE "JALY|Incompatible|requires|Mixin apply failed|InvalidInjection|Caused by|crash" work/logs/latest.log | cut -c1-400 | head -80 || tail -60 client.out
          for f in work/crash-reports/*.txt; do [ -f "$f" ] && { echo "=====CRASH"; head -120 "$f"; }; done
          i=0
          for f in work/screenshots/*.png; do
            [ -f "$f" ] || continue
            i=$((i+1)); convert "$f" -resize 960x -quality 70 shot.jpg
            echo "=====SHOT $i"; base64 -w 120 shot.jpg; echo "=====ENDSHOT"
          done
          grep -q "JALY-SMOKE\] done, failures=0" work/logs/latest.log
