name: Test in game
on:
  push:
    branches: [main]
    paths: ['mod/**', 'launcher/catalog.json', 'tools/fetch_modpack.py', '.github/workflows/smoke.yml']
  workflow_dispatch: {}
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        pack: [jaly-only, full-modpack]
    name: smoke (${{ matrix.pack }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri imagemagick >/dev/null
      - name: Make a test world
        working-directory: mod
        run: |
          mkdir -p run && cd run
          echo eula=true > eula.txt
          printf 'level-type=minecraft\\:flat\nonline-mode=false\nspawn-monsters=false\n' > server.properties
          cd ..
          (gradle runServer --args nogui > server.out 2>&1 &)
          for i in $(seq 1 100); do sleep 3; grep -q 'Done (' run/logs/latest.log 2>/dev/null && break; done
          tail -3 run/logs/latest.log || tail -30 server.out
          sleep 5
          pkill -f KnotServer || pkill -f runServer || true
          sleep 5
          gradle --stop || true
          mkdir -p run/saves && cp -r run/world run/saves/smoke
          rm -f run/saves/smoke/session.lock
      - name: Add the launcher modpack
        if: matrix.pack == 'full-modpack'
        run: python3 tools/fetch_modpack.py mod/run/mods
      - name: Launch the game
        working-directory: mod
        env: { JALY_SMOKE: '1' }
        run: |
          printf 'onboardAccessibility:false\ntutorialStep:none\nnarrator:0\nsoundCategory_master:0.0\nguiScale:2\n' > run/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" timeout 900 gradle runClient > client.out 2>&1 || echo "EXIT $?"
          echo "=====CLIENTLOG"
          grep -nE "JALY|JalyClient|jalyclient|ERROR|Exception|Caused by|at fr\.darkerdawn|Mixin|crash" run/logs/latest.log | cut -c1-400 | head -150 || true
          echo "=====TAIL"
          tail -15 client.out
          for f in run/crash-reports/*.txt; do [ -f "$f" ] && { echo "=====CRASH"; head -150 "$f"; }; done
          i=0
          for f in run/screenshots/*.png; do
            [ -f "$f" ] || continue
            i=$((i+1))
            convert "$f" -resize 960x -quality 70 shot.jpg
            echo "=====SHOT $i"
            base64 -w 120 shot.jpg
            echo "=====ENDSHOT"
          done
          echo "=====END"
          grep -q "JALY-SMOKE\] done, failures=0" client.out run/logs/latest.log
