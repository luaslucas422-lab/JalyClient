name: Shop server
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test the server locally (no Cloudflare account needed)
        working-directory: server
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          wrangler d1 execute jalyclient-shop --local --file schema.sql
          printf 'STRIPE_WEBHOOK_SECRET=whsec_test\n' > .dev.vars
          (wrangler dev --local --port 8787 > dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -s http://127.0.0.1:8787/health && break; sleep 1; done
          node test.mjs http://127.0.0.1:8787 || { tail -40 dev.log; exit 1; }
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deploy to Cloudflare
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: server
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          npm i -g wrangler@4 >/dev/null 2>&1
          ID=$(wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="jalyclient-shop");console.log(d?d.uuid:"")')
          if [ -z "$ID" ]; then wrangler d1 create jalyclient-shop; ID=$(wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(x=>x.name==="jalyclient-shop").uuid)'); fi
          sed -i "s/REPLACED_BY_CI/$ID/" wrangler.toml
          wrangler d1 execute jalyclient-shop --remote --file schema.sql
          wrangler deploy | tee deploy.log
          [ -n "$STRIPE_SECRET_KEY" ] && echo "$STRIPE_SECRET_KEY" | wrangler secret put STRIPE_SECRET_KEY
          [ -n "$STRIPE_WEBHOOK_SECRET" ] && echo "$STRIPE_WEBHOOK_SECRET" | wrangler secret put STRIPE_WEBHOOK_SECRET
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Shop server live at $URL"
          if [ -n "$URL" ] && [ "$(cat endpoint.txt 2>/dev/null)" != "$URL" ]; then
            echo "$URL" > endpoint.txt
            git config user.name "jaly-bot"; git config user.email "jaly-bot@users.noreply.github.com"
            git add endpoint.txt && git commit -m "Shop server endpoint" && git push
          fi
      - name: Waiting for Cloudflare keys
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets to deploy the shop server."
