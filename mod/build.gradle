plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = 'fr.darkerdawn.jaly'

base { archivesName = 'JalyClient' }

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

loom {
    accessWidenerPath = file('src/main/resources/jalyclient.accesswidener')
    runs {
        client {
            if (System.getenv('JALY_SMOKE')) {
                vmArg '-Djaly.smoke=true'
                programArgs '--quickPlaySingleplayer', 'smoke'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    // MP3 decoding for custom music discs (bundled inside the JalyClient jar)
    implementation 'javazoom:jlayer:1.0.1'
    include 'javazoom:jlayer:1.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging { events 'passed', 'failed'; exceptionFormat 'full' }
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// Prints the public/protected API of every Minecraft/Fabric class JalyClient uses (for porting to other versions).
tasks.register('apiDump') {
    doLast {
        def cp = sourceSets.main.compileClasspath.asPath
        def classes = file('../tools/api_classes.txt').readLines().findAll { it.trim() }
        def out = new File(buildDir, 'api.txt')
        out.text = ''
        classes.each { c ->
            def proc = ['javap', '-protected', '-cp', cp, c].execute()
            def txt = proc.text + proc.err.text
            out << "#### ${c}\n" << txt << "\n"
        }
        println "API dump: ${out} (${out.length()} bytes)"
    }
}
